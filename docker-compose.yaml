services:
  db:
    image: postgres:17
    container_name: 69-s2-db
    restart: always

    environment:
      POSTGRES_USER: PostgreSQL
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: cybersec

    ports:
      - "54321:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s2-admin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: 1234

    ports:
      - "8080:80"

    depends_on:
      - db

    volumes:
      - ./data-pgadmin:/var/lib/pgadmin

  app:
    image: prawee/strapi
    container_name: 69-s2-app
    restart: always

    ports:
      - "9092:1337"

    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: cybersec
      DATABASE_USERNAME: PostgreSQL
      DATABASE_PASSWORD: 1234

    depends_on:
      - db

volumes:
  postgres_data:
